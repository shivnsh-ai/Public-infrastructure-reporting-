<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <h1>Public Infrastructure Damage Reporting System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="report.html">Report Damage</a>
        <a href="complaint.html">My Complaints</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

</header>


<section class="form-section">

    <h2>Admin Login</h2>

    <form onsubmit="return adminLogin()">

        <input
            type="text"
            id="adminUsername"
            placeholder="Enter Admin Username"
            required
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter Admin Password"
            required
        >

        <button type="submit">
            Admin Login
        </button>

    </form>

</section>


<footer>

    <p>© 2026 Public Infrastructure Damage Reporting System</p>

</footer>


<script src="js/script.js"></script>

</body>
</html>
