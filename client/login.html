<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Public Infrastructure Damage Reporting System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <h1>Public Infrastructure Damage Reporting System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="report.html">Report Damage</a>
        <a href="complaint.html">My Complaints</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
       <a href="admin-login.html">Admin</a>
    </nav>

</header>

<section class="form-section">

    <h2>Login</h2>

    <form onsubmit="return loginUser()">

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter Email Address"
            required
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p style="text-align:center; margin-top:20px;">
        Don't have an account?
        <a href="register.html">Register here</a>
    </p>

</section>

<footer>

    <p>© 2026 Public Infrastructure Damage Reporting System</p>

</footer>

<script src="js/script.js"></script>

</body>
</html>
